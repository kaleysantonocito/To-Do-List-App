<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tasks-and-focus">
        <div class="my-tasks">
            <h1>My Tasks</h1>
            <p id="taskCount">0 tasks remaining</p>

            <div class="add-task">
                <input type="text" placeholder="Add a new task">

                <div class="task-controls">
                    <select id="taskPriority">
                        <option value="Low" selected>Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>

                    <button id="addTaskButton">+ Add task</button>
                </div>
            </div>

            <hr>

            <div class="task-list">
                <!-- Tasks will be dynamically added here -->
                 <div class="task-card">

                    <div class="task-top">
                        <input type="checkbox">

                        <div class="task-info">
                            <span class="task-title">Study for quiz</span>
                            <span class="priority-label">High</span>
                        </div>

                        <div class="task-actions">
                            <button class="edit-button" aria-label="Edit task">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                                <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </button>
                            
                            <button class="delete-button" aria-label="Delete task">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                                <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="task-bottom">
                        <button>Doing now</button>
                    </div>

                 </div>
            </div>

        </div>

        <div class="focus-session">
            <h1>Focus Session</h1>

            <div class="current-task">
                 <p>CURRENTLY WORKING ON</p>
                 <span id="currentTask">No task selected</span>
            </div>

            <div class="focus-timer">
                <span id="timerDisplay">00:00</span>
            </div>

            <p>Session duration</p>
            <div class="session-settings">

                 <select id="sessionDuration">
                     <option value="10">10 minutes</option>
                     <option value="20">20 minutes</option>
                     <option value="30">30 minutes</option>
                     <option value="40">40 minutes</option>
                     <option value="50">50 minutes</option>
                     <option value="60">60 minutes</option>
                     <option value="70">70 minutes</option>
                     <option value="80">80 minutes</option>
                     <option value="90">90 minutes</option>
                     <option value="100">100 minutes</option>
                     <option value="110">110 minutes</option>
                     <option value="120">120 minutes</option>
                 </select>

                 <div class="timer-buttons">
                    <button>Start/Stop</button>
                    <button>Reset</button>
                 </div>
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tasks-and-focus">
        <div class="my-tasks">
            <h1>My Tasks</h1>
            <p id="taskCount">0 tasks remaining</p>

            <div class="add-task">
                <input type="text" id="taskInput" placeholder="Add a new task">

                <div class="task-controls">
                    <select id="taskPriority">
                        <option value="Low" selected>Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>

                    <button id="addTaskButton">+ Add task</button>
                </div>
            </div>

            <hr>

            <div class="task-list">
                <!-- Tasks will be dynamically added here -->
            </div>

        </div>

        <div class="focus-session">
            <h1>Focus Session</h1>

            <div class="current-task">
                 <p>CURRENTLY WORKING ON</p>
                 <span id="currentTask">No task selected</span>
            </div>

            <div class="focus-timer">
                <span id="timerDisplay">00:00</span>
            </div>

            <p>Session duration</p>
            <div class="session-settings">

                 <select id="sessionDuration">
                     <option value="10">10 minutes</option>
                     <option value="20">20 minutes</option>
                     <option value="30">30 minutes</option>
                     <option value="40">40 minutes</option>
                     <option value="50">50 minutes</option>
                     <option value="60">60 minutes</option>
                     <option value="70">70 minutes</option>
                     <option value="80">80 minutes</option>
                     <option value="90">90 minutes</option>
                     <option value="100">100 minutes</option>
                     <option value="110">110 minutes</option>
                     <option value="120">120 minutes</option>
                 </select>

                 <div class="timer-buttons">
                    <button id="startStopButton">Start/Stop</button>
                    <button id="resetButton">Reset</button>
                 </div>

                 <div class="task-completion" hidden>  <!-- Hidden until timer is finished -->
                    <p>Did you complete this task?</p>
                    <button id="finishYes">Yes</button>
                    <button id="finishNo">No</button>
                 </div>
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
